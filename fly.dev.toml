# DEV environment — deployed by CI on every push to the `staging` branch.
# Topology (deploy-restructure-plan.md): staging branch → DEV, main → STAGING,
# production → PRODUCTION. Dev stays in iad: gru has no capacity — a
# release_command machine pinned there cannot restart, which blocks every
# deploy at its first step. Do not move without checking capacity first.
app = 'properfy-api-dev'
primary_region = 'iad'

[build]
  dockerfile = 'apps/backend/Dockerfile'

[deploy]
  # Migrate, then refresh the QA role fixtures (AM / OP / CL_ADMIN / CL_USER).
  # provision-qa-users is idempotent — safe to rerun on every release. It must
  # NEVER run in production (see fly.production.toml).
  release_command = 'sh -lc "cd /app/apps/backend && prisma migrate deploy && node dist/provision-qa-users.js"'

[env]
  NODE_ENV = 'staging'
  # Explicit pg-boss queue schema — authoritative, do NOT rely on NODE_ENV inference.
  PGBOSS_SCHEMA = 'pgboss_dev'
  PORT = '3000'
  LOG_LEVEL = 'info'
  JWT_ACCESS_TOKEN_TTL_MINUTES = '60'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  method = 'GET'
  timeout = '10s'
  path = '/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
