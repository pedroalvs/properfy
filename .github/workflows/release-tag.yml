name: Release Tag

# Automated semver tagging for production (deploy-restructure-plan.md §8.5).
# Fires alongside the deploy workflows when CI succeeds on main (production); the deploys pin the same head SHA this job tags.
#
# Bump rules, derived from Conventional Commits since the last v* tag:
#   - only fix:/chore:/refactor:/etc. → patch
#   - at least one feat:             → minor
#   - major NEVER happens implicitly — only an explicit [release:major]
#     token in the head commit message (the dev's call; the developing AI
#     may suggest it but never adds it on its own).
# First tag ever: v1.0.0.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag & release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency: release-tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          # Only stable v<maj>.<min>.<patch> tags reachable from this commit —
          # prereleases or tags from unrelated history must not seed the bump.
          last=$(git tag --list 'v*' --merged "$sha" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)

          if [ -z "$last" ]; then
            echo "version=v1.0.0" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rerun idempotency: HEAD already tagged → nothing to do.
          if git tag --points-at "$sha" | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          major=$(echo "${last#v}" | cut -d. -f1)
          minor=$(echo "${last#v}" | cut -d. -f2)
          patch=$(echo "${last#v}" | cut -d. -f3)

          # Fixed-string greps over commit subjects — no eval, no interpolation.
          git log --format='%s' "$last..$sha" > /tmp/subjects.txt
          git log -1 --format='%B' "$sha" > /tmp/head-message.txt

          # The major marker is only honored on a merge commit (≥2 parents) —
          # the plan requires it in the MERGE commit message, and direct pushes
          # must not be able to smuggle a major.
          parent_count=$(git rev-list --parents -n 1 "$sha" | wc -w)
          if grep -qF '[release:major]' /tmp/head-message.txt && [ "$parent_count" -ge 3 ]; then
            next="v$((major + 1)).0.0"
          elif grep -qE '^feat(\(|!|:)' /tmp/subjects.txt; then
            next="v${major}.$((minor + 1)).0"
          else
            next="v${major}.${minor}.$((patch + 1))"
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create release (creates the tag)
        if: steps.version.outputs.skip != 'true'
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
