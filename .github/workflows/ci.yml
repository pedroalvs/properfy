name: CI

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job below. Nothing here pushes, comments or calls the
# API — the jobs only lint, typecheck, test and build — so read access to the
# contents is all GITHUB_TOKEN ever needs, regardless of the repository default.
permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Shared setup: pnpm + Node + install + shared build + Prisma client.
      # Prisma client is generated on-demand from schema.prisma — without it,
      # backend typecheck fails with "Module '@prisma/client' has no exported
      # member 'PrismaClient'" and similar enum errors. Shared must be built so
      # downstream typecheck can resolve it via package exports.
      - uses: ./.github/actions/setup
        with:
          build-shared: "true"
          prisma-generate: "true"

      - name: Lint shared
        run: pnpm --filter shared lint

      - name: Lint backend
        run: pnpm --filter backend lint

      - name: Lint web
        run: pnpm --filter web lint

      # The PWA had no CI coverage at all until 2026-07-30: no lint, typecheck,
      # test or build ran on any PR, and its only build happened in
      # pages-deploy.yml *after* merge. That gap let `h-18` — a Tailwind spacing
      # class the config never defined, so silently dropped — sit in the bottom
      # nav for four months, alongside a complete absence of safe-area handling
      # despite index.html opting into `viewport-fit=cover`.
      - name: Lint pwa
        run: pnpm --filter pwa lint

      - name: Typecheck shared
        run: pnpm --filter shared typecheck

      - name: Typecheck backend
        run: pnpm --filter backend typecheck

      - name: Typecheck web
        run: pnpm --filter web typecheck

      - name: Typecheck pwa
        run: pnpm --filter pwa typecheck

  # Contract freshness — the committed OpenAPI spec and the generated typed
  # client must never drift from the backend route schemas. Regenerate both
  # from source and fail if anything changed vs what is committed. Without this
  # gate a route/schema change can land while packages/shared/openapi.json and
  # src/api-types.ts stay stale, so the web/pwa typed client silently lies
  # about the contract (HOL-7). generate:openapi builds the Fastify app
  # in-memory (NODE_ENV=test → routes only, no DB connection) and validateEnv
  # requires these vars to be present; the values are throwaway placeholders.
  contract-freshness:
    name: OpenAPI ↔ api-types freshness
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_PRIVATE_KEY: ci-placeholder-private-key
      JWT_PUBLIC_KEY: ci-placeholder-public-key
      PORTAL_TOKEN_ENC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      APP_CREDENTIAL_ENC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          build-shared: "true"
          prisma-generate: "true"

      - name: Regenerate OpenAPI spec + typed client
        run: pnpm generate:api

      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --exit-code -- packages/shared/openapi.json packages/shared/src/api-types.ts; then
            echo "::error::OpenAPI spec / api-types are stale. Run 'pnpm generate:api' and commit the result."
            exit 1
          fi

  test-shared:
    name: Test shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm --filter shared test

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          build-shared: "true"
          prisma-generate: "true"

      - run: pnpm --filter backend test

  test-web:
    name: Test web
    runs-on: ubuntu-latest
    # Hard gate. A prior "cumulative web-suite OOM" was misdiagnosed as a
    # suite-wide map/GL teardown leak and worked around with an 8-shard
    # matrix + `continue-on-error` (one shard always OOMed, non-blocking).
    # Root cause was actually a SINGLE test file: FinancialEntryFormDrawer
    # .test.tsx mocked useFinancialEntrySave to return a fresh function for
    # resetIdempotencyKey on every render; that unstable reference sat in a
    # useEffect dependency that calls setErrors({}), so the effect re-ran
    # every render → unbounded re-render loop → heap exhausted. (vitest's
    # isolate:true already runs each file in its own process, so there was
    # no cross-file accumulation.) With the mock made stable the full suite
    # runs green in ~85s, so the shard matrix and the soft-fail are removed.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          build-shared: "true"

      - name: Test web
        run: pnpm --filter web test

  test-pwa:
    name: Test pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          build-shared: "true"

      - name: Test pwa
        run: pnpm --filter pwa test

  test-web-e2e:
    name: E2E web (Playwright)
    runs-on: ubuntu-latest
    # Added after the suite was found broken on develop with nobody noticing:
    # it had never been wired into CI, so two deliberate UI changes (the
    # same-tab navigation overhaul and the portal redesign) left seven specs
    # asserting a UI that no longer existed. Running them here is what turns
    # them back into a signal. The suite stubs every API call, so it needs no
    # backend or database.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          build-shared: "true"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        # Only Chromium: playwright.config.ts defines a single Desktop Chrome
        # project, and pulling the other engines triples the install time.
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter web test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    # All `needs` jobs are hard gates. (test-web was restored to a blocking
    # check once the single-file web-suite OOM was fixed.)
    needs: [lint-typecheck, test-shared, test-backend, test-web, test-pwa]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          build-shared: "true"
          prisma-generate: "true"

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build web
        run: pnpm --filter web build

      # No env needed: apps/pwa/src/config/env.ts falls back to localhost when
      # VITE_API_BASE_URL is absent. This job proves the bundle compiles; the
      # real values are injected by pages-deploy.yml.
      - name: Build pwa
        run: pnpm --filter pwa build

  prisma-validate:
    name: Prisma schema validation (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Validate Prisma schema
        working-directory: apps/backend
        # `prisma validate` short-circuits to a syntax-only check and does
        # not open a connection, but it still resolves `env()` references
        # at parse time. Provide dummy placeholders so the schema's
        # `datasource.url` / `directUrl` env() calls don't block the check.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma validate

  # Sprint 1 W-6 — real-database migration check (un-gated 2026-04-13).
  #
  # Runs `prisma migrate deploy` against a fresh PostGIS-enabled Postgres
  # container to prove the migration chain can rebuild the schema from
  # scratch. This is the auditable counterpart to `prisma validate` (which
  # only checks schema.prisma syntax, not migration correctness).
  #
  # Previously this job was marked `continue-on-error: true` because
  # CORRECTION-007 (schema migration drift) made a fresh replay impossible.
  # After the CORRECTION-007 reconciliation sprint (2026-04-13), the chain
  # is clean end-to-end: all 51 migrations apply on a fresh database and
  # the second run is a no-op. The flag has been removed — this job is
  # now a hard gate on every PR and push.
  #
  # See `specs/GAPS.md` -> CORRECTION-007 for the full history.
  prisma-migrate-check:
    name: Prisma migrate deploy (fresh DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: properfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/properfy_test
      DIRECT_URL: postgresql://test:test@localhost:5432/properfy_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Apply migrations against fresh Postgres
        working-directory: apps/backend
        run: npx prisma migrate deploy
      - name: Apply migrations a second time (idempotence check)
        working-directory: apps/backend
        run: npx prisma migrate deploy

  # Sprint 1 W-1/W-2/W-3 - real-database integration tests via testcontainers.
  #
  # Spins up an ephemeral PostGIS-enabled Postgres via testcontainers inside
  # the Node process (not via a GitHub Actions service container, because
  # testcontainers manages its own container lifecycle). Runs the W-1 harness
  # validation test, W-2 cross-check invariance end-to-end, and W-3 retention
  # vs erasure concurrency end-to-end.
  #
  # This job is the canonical verification of the 006 cross-check invariant
  # (FR-008) and the 020 IN_PROGRESS concurrency guard under real Prisma +
  # real SQL. If this job is red, audit-ready is not achievable.
  integration-db:
    name: Integration tests (real DB via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          prisma-generate: "true"

      - name: Run real-DB integration tests
        working-directory: apps/backend
        run: pnpm test:integration:db
