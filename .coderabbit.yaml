# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for Properfy.
# Governs BOTH the cloud CodeRabbit GitHub App (auto PR reviews) and the
# `coderabbit` CLI. Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit
#
# Reviews use the "assertive" profile (thorough). Switch to "chill" for fewer,
# higher-signal comments.

language: "en-US"

reviews:
  # "assertive" = more thorough, more nitpicks; "chill" = signal over noise.
  profile: "assertive"
  # Don't formally block merges with a "request changes" review; comment instead.
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  poem: false

  auto_review:
    enabled: true
    drafts: false # skip draft PRs
    # Auto-review PRs to any base branch (base_branches accepts regex; ".*" = all).
    base_branches:
      - ".*"

  # Skip generated / vendored / lock files — reviewing these is pure noise.
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!pnpm-lock.yaml"
    - "!packages/shared/src/api-types.ts" # generated by openapi-typescript from openapi.json
    - "!packages/shared/openapi.json" # generated from backend routes
    - "!apps/backend/prisma/migrations/**" # generated SQL migrations
    - "!.claude/**" # local worktrees, agents, memory

  # Project-specific guidance per area, mirrored from CLAUDE.md so the App reviews
  # against Properfy conventions instead of giving generic advice.
  path_instructions:
    - path: "apps/backend/**"
      instructions: >-
        Clean Architecture (strict for apps/backend/src/**/*.ts): domain has no external
        dependencies; application orchestrates; infrastructure implements ports;
        interfaces (Fastify handlers) only parse, validate, call a use case and map the
        response — no business logic. Enforce multi-tenant safety: every business query
        and repository must be scoped by tenant_id (no business query without tenant
        scope); JWT tenant_id/role authorization is centralized in the application layer
        and must never trust tenant_id from the request body or query. Validate all API
        payloads with Zod. REST under the /v1 prefix; errors use the
        { error: { code, message, details } } envelope; request_id is mandatory on every
        API request and job. Appointment state-machine transitions must register an audit
        log and validate actor RBAC; sensitive transitions require a reason. Financial
        rules: tenant debit and inspector payout occur at DONE and require an operator
        cross-check; cancellation has no cost; refund only when a service was marked done
        but not actually executed; manual financial adjustments are AM/OP only. Apply
        idempotency on critical commands (acceptance, execution, financial entries). Flag
        any tenant_id WHERE filter not covered by a Postgres-real integration test (mocks
        can hide tenant-scope bugs).
    - path: "apps/backend/src/**/domain/**/*.ts"
      instructions: >-
        Domain layer — pure business logic only. No framework, Prisma, Fastify or
        pg-boss imports; no I/O. Only entities, value objects, repository ports
        (interfaces) and domain events belong here. Entities carry behaviour and
        enforce their own invariants; invalid states must be unrepresentable rather
        than validated after the fact. Flag any import that reaches outward to
        application/infrastructure/interfaces — the dependency rule points inward.
    - path: "apps/backend/src/**/application/**/*.ts"
      instructions: >-
        Application layer — one use case per class with an execute() method,
        orchestrating domain logic through ports. Define DTOs and Zod schemas here.
        Authorization and idempotency are enforced in this layer, not only in the
        route (a non-HTTP caller must be validated too). No direct Prisma, Fastify or
        pg-boss imports — depend on domain interfaces. Cross-module side effects go
        through domain events. Scope every repository call by tenant_id.
    - path: "apps/backend/src/**/interfaces/**/*.ts"
      instructions: >-
        Interfaces layer — thin Fastify adapters only: parse, validate (Zod), call the
        use case, map the response. No business logic. Derive tenant scope from the
        JWT context; never trust tenantId from the request body or query. Propagate
        request_id. Errors must use the shared envelope { error: { code, message,
        details } } with the standard code→status mapping (VALIDATION_ERROR 400,
        FORBIDDEN 403, NOT_FOUND 404, CONFLICT 409). Accept Idempotency-Key on
        critical operations.
    - path: "apps/web/**"
      instructions: >-
        React + TypeScript + Tailwind. The OpenAPI-generated client
        (api = createClient<paths>) is the ONLY way to reach the API: flag any raw
        fetch, hand-rolled path, local DTO that duplicates a contract type, or `as any`
        cast on an api path/params/response (a template-literal path can never match the
        generated union — that cast defeats the check). Import shared DTOs and enums from
        packages/shared instead of redeclaring them or using magic status strings.
        React Query owns server state; data hooks must return referentially stable
        values (wrap payload-derived objects/arrays in useMemo keyed on the raw data —
        the PR #961 render-loop rule). Every data screen implements loading, error
        (recoverable, with retry) and empty states — a dropped isError that renders the
        empty state as if the fetch succeeded is a bug. Dialogs must manage focus
        (role="dialog", focus move-in, Escape) — reuse Dialog/ConfirmDialog rather than
        raw overlays; custom widgets must be fully keyboard-operable and an ARIA role
        (radio/tab/option/…) obliges its keyboard pattern (roving tabindex, arrows,
        Escape stopPropagation). Prefer design tokens over hardcoded hex. Reuse
        design-system primitives (FilterSelect / FilterMultiSelect / FilterBar /
        DataTable) instead of raw HTML for filters and tables. Never expose raw IDs in
        the UI — show readable fields (e.g. number + address + status + date). DataTable
        sorts client-side via useMemo; do not send sortBy/sortOrder to the API. List
        pages must show data immediately; selectors filter, they do not gate.
    - path: "apps/pwa/**"
      instructions: >-
        Inspector PWA (React + Vite + Tailwind). Same API-contract rules as the web
        portal: the OpenAPI-generated client is the only API access — no raw fetch,
        hand-rolled path, duplicated DTO, or `as any` on a path/params/response; import
        DTOs and enums from packages/shared, not local copies or magic strings. React
        Query owns server state and data hooks return referentially stable values
        (useMemo on payload-derived arrays — the PR #961 rule). Every screen implements
        loading, error (with retry), empty and offline states. Touch targets are at
        least 44px. Geolocation must handle permission-request, denied and error paths;
        actions taken offline must give clear feedback / queue rather than fail silently.
        Dialogs and custom widgets follow the same focus-management and keyboard rules as
        web. Reuse the shared design-system primitives and keep parity with the web
        portal conventions and visual tokens.
    - path: "packages/shared/**"
      instructions: >-
        Source of truth for shared Zod schemas, types and enums consumed across
        workspaces. api-types.ts is generated from openapi.json — it must never be
        hand-edited; regenerate via the generate:types script instead.
    - path: "apps/backend/**/*.{test,spec}.ts"
      instructions: >-
        TDD is mandatory. Tests must cover behavior (red-green-refactor), not merely
        that a component renders: an assertion must fail if the behavior it names is
        broken (e.g. asserting a column header does not test a loading state; a test
        named for one string must assert that string). Fixtures must match the real API
        response shape and use shared enums, not invented fields or magic status
        literals. Include tenant-scope filters asserted against a real Postgres, since
        mocks return regardless of the tenant_id argument and can mask isolation bugs.
    - path: "apps/{web,pwa}/**/*.{test,spec}.{ts,tsx}"
      instructions: >-
        TDD is mandatory (red-green-refactor). Cover component and hook behavior with
        Vitest + Testing Library, asserting user-visible behavior over implementation
        details, and mock API responses. The real-Postgres tenant-scope rule does not
        apply to frontend suites.

chat:
  auto_reply: true
